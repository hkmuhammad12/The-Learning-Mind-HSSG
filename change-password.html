<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password — The Learning Minds Higher Secondary School</title>
<link rel="icon" href="/assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<style>
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,var(--primary-dark),var(--primary) 60%,var(--primary-2));}
  .login-card{max-width:400px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6);animation:pageIn .5s ease both;}
  .login-card .brand{justify-content:center;margin-bottom:20px;}
  .login-card h1{font-size:1.3rem;text-align:center;margin-bottom:6px;}
  .login-card p.sub{text-align:center;color:var(--slate);font-size:.88rem;margin-bottom:24px;}
  .field{margin-bottom:16px;}
  .field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:.95rem;}
  .field label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;}
</style>
</head>
<body class="dash">
<div class="login-wrap">
  <div class="login-card">
    <a href="/" class="brand"><img src="/assets/logo.png" alt="School logo"><span class="brand-text">The Learning Minds</span></a>
    <h1>Set a new password</h1>
    <p class="sub">Please choose a new password for your account.</p>
    <form id="cpForm">
      <div class="field"><label for="currentPassword">Current password</label><input type="password" id="currentPassword" required autocomplete="current-password"></div>
      <div class="field"><label for="newPassword">New password (min 8 characters)</label><input type="password" id="newPassword" required minlength="8" autocomplete="new-password"></div>
      <div class="field"><label for="confirmPassword">Confirm new password</label><input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Save and continue</button>
      <div class="form-msg" id="cpMsg"></div>
    </form>
  </div>
</div>
<script src="/js/notify.js"></script>
<script>
(async () => {
  const me = await fetch('/api/auth/me');
  if (!me.ok) { location.href = '/login.html'; return; }
  window.__role = (await me.json()).role;
})();

document.getElementById('cpForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('cpMsg');
  msg.className = 'form-msg';
  const p1 = document.getElementById('newPassword').value;
  const p2 = document.getElementById('confirmPassword').value;
  if (p1 !== p2) { msg.className = 'form-msg show error'; msg.textContent = 'Passwords do not match.'; return; }

  const res = await fetch('/api/auth/change-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ currentPassword: document.getElementById('currentPassword').value, newPassword: p1 })
  });
  if (!res.ok) { const d = await res.json(); msg.className = 'form-msg show error'; msg.textContent = d.error || 'Could not update password.'; return; }

  TLM.success('Your password has been updated.', 'Password changed');
  await new Promise(r => setTimeout(r, 900));
  const role = window.__role;
  if (role === 'admin') location.href = '/admin.html';
  else if (role === 'teacher') location.href = '/teacher-dashboard.html';
  else location.href = '/student-dashboard.html';
});
</script>
</body>
</html>
