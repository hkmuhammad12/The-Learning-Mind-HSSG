<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Dashboard — The Learning Minds Higher Secondary School</title>
<link rel="icon" href="/assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body class="dash">
<div class="admin-shell">
  <div class="admin-topbar">
    <a href="/" class="brand"><img src="/assets/logo.png" alt="School logo"><span class="brand-text">The Learning Minds<small>Student Dashboard</small></span></a>
    <div class="keybox">
      <span id="sessionName" style="color:var(--slate);font-size:.9rem;"></span>
      <button class="btn btn-ghost" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="panel">
    <h3 style="font-size:1rem;margin-bottom:14px;">My profile</h3>
    <div class="fact-list" id="profileFacts"></div>
  </div>

  <div class="panel">
    <h3 style="font-size:1rem;margin-bottom:14px;">Announcements</h3>
    <div class="ann-list" id="annList"></div>
  </div>
</div>

<script src="/js/notify.js"></script>
<script src="/js/auth-guard.js"></script>
<script src="/js/student.js"></script>
</body>
</html>
